name: Prepare dependency lockfile

on:
  push:
    branches:
      - dev/stability-error-handling
    paths:
      - .github/workflows/prepare-dependency-lockfile.yml

permissions:
  contents: write

jobs:
  regenerate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out development branch
        uses: actions/checkout@v4

      - name: Set up supported Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Upgrade ioBroker testing dependency and regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --save-dev @iobroker/testing@^6.3.2

      - name: Install the exact regenerated dependency tree
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run adapter integration tests with @iobroker/testing 6.x
        run: npm run test:integration

      - name: Run lint
        run: npm run lint

      - name: Commit package update and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git rm .github/workflows/prepare-dependency-lockfile.yml
          git commit -m "chore: upgrade ioBroker testing to 6.3.2"
          git push

      - name: Upload regenerated manifest and lockfile
        uses: actions/upload-artifact@v4
        with:
          name: mhi-testing-6-lockfile
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
